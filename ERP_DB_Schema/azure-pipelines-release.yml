# Pipeline de Release/Deployment para Base de Datos Vie_ERP
# Este pipeline maneja el deployment a diferentes entornos usando el template

trigger: none # Solo se ejecuta manualmente o desde release pipeline

pr: none

resources:
  pipelines:
  - pipeline: build
    source: 'Vie_ERP_Database_CI'  # Nombre del pipeline de CI
    trigger:
      branches:
        include:
        - main

variables:
  # Variables globales
  artifactName: 'vie-erp-database'

stages:

# ===================================================================
# DEPLOYMENT A DESARROLLO
# ===================================================================
- stage: DeployDev
  displayName: 'Deploy to Development'
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
  variables:
    environment: 'dev'
    sqlServerInstance: '$(DevSqlServer)'      # Variable definida en el grupo de variables
    databaseName: 'Vie_ERP_Dev'
    serviceConnection: 'DevServiceConnection'
  jobs:
  - deployment: DeployToDevDB
    displayName: 'Deploy Database to Development'
    environment: 'development'
    pool:
      vmImage: 'windows-latest'
    strategy:
      runOnce:
        deploy:
          steps:
          - template: templates/database-deployment.yml
            parameters:
              environment: '$(environment)'
              sqlServerInstance: '$(sqlServerInstance)'
              databaseName: '$(databaseName)'
              serviceConnection: '$(serviceConnection)'
              skipValidation: false
              backupDatabase: false
              deploymentMode: 'Complete'

# ===================================================================
# DEPLOYMENT A TEST
# ===================================================================
- stage: DeployTest
  displayName: 'Deploy to Test'
  dependsOn: DeployDev
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
  variables:
    environment: 'test'
    sqlServerInstance: '$(TestSqlServer)'
    databaseName: 'Vie_ERP_Test'
    serviceConnection: 'TestServiceConnection'
  jobs:
  - deployment: DeployToTestDB
    displayName: 'Deploy Database to Test'
    environment: 'test'
    pool:
      vmImage: 'windows-latest'
    strategy:
      runOnce:
        deploy:
          steps:
          - template: templates/database-deployment.yml
            parameters:
              environment: '$(environment)'
              sqlServerInstance: '$(sqlServerInstance)'
              databaseName: '$(databaseName)'
              serviceConnection: '$(serviceConnection)'
              skipValidation: false
              backupDatabase: true
              deploymentMode: 'Incremental'

# ===================================================================
# DEPLOYMENT A STAGING (Requiere aprobación manual)
# ===================================================================
- stage: DeployStaging
  displayName: 'Deploy to Staging'
  dependsOn: DeployTest
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  variables:
    environment: 'staging'
    sqlServerInstance: '$(StagingSqlServer)'
    databaseName: 'Vie_ERP_Staging'
    serviceConnection: 'StagingServiceConnection'
  jobs:
  - deployment: DeployToStagingDB
    displayName: 'Deploy Database to Staging'
    environment: 'staging'  # Configurar con aprobaciones manuales
    pool:
      vmImage: 'windows-latest'
    strategy:
      runOnce:
        deploy:
          steps:
          - template: templates/database-deployment.yml
            parameters:
              environment: '$(environment)'
              sqlServerInstance: '$(sqlServerInstance)'
              databaseName: '$(databaseName)'
              serviceConnection: '$(serviceConnection)'
              skipValidation: false
              backupDatabase: true
              deploymentMode: 'Incremental'

          # Pruebas adicionales de smoke testing en staging
          - task: PowerShell@2
            displayName: 'Staging Smoke Tests'
            inputs:
              targetType: 'inline'
              script: |
                Write-Host "🧪 Running smoke tests on staging environment..."
                
                $smokeTests = @(
                  @{
                    Name = "Database Connection"
                    Description = "Verify database is accessible"
                  },
                  @{
                    Name = "Core Tables"
                    Description = "Verify critical tables exist and have data"
                  },
                  @{
                    Name = "Stored Procedures"
                    Description = "Verify key stored procedures execute"
                  },
                  @{
                    Name = "Performance Baseline"
                    Description = "Verify basic query performance"
                  }
                )
                
                $allTestsPassed = $true
                
                foreach ($test in $smokeTests) {
                  Write-Host "Running test: $($test.Name)"
                  Write-Host "  Description: $($test.Description)"
                  
                  # Simular ejecución de prueba
                  Start-Sleep -Seconds 2
                  
                  # En implementación real, ejecutar pruebas específicas
                  $testResult = Get-Random -Minimum 1 -Maximum 10
                  
                  if ($testResult -gt 2) {  # 80% probabilidad de éxito
                    Write-Host "  ✅ PASSED" -ForegroundColor Green
                  } else {
                    Write-Host "  ❌ FAILED" -ForegroundColor Red
                    $allTestsPassed = $false
                  }
                }
                
                if ($allTestsPassed) {
                  Write-Host "🎉 All smoke tests passed - staging environment is healthy!"
                } else {
                  Write-Error "❌ Smoke tests failed - staging deployment needs investigation"
                  exit 1
                }

# ===================================================================
# DEPLOYMENT A PRODUCCIÓN (Requiere múltiples aprobaciones)
# ===================================================================
- stage: DeployProd
  displayName: 'Deploy to Production'
  dependsOn: DeployStaging
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  variables:
    environment: 'prod'
    sqlServerInstance: '$(ProdSqlServer)'
    databaseName: 'Vie_ERP_Prod'
    serviceConnection: 'ProdServiceConnection'
  jobs:
  
  # Pre-production readiness checks
  - job: PreProductionChecks
    displayName: 'Pre-Production Validation'
    pool:
      vmImage: 'windows-latest'
    steps:
    - task: PowerShell@2
      displayName: 'Production Readiness Assessment'
      inputs:
        targetType: 'inline'
        script: |
          Write-Host "🔒 PRODUCTION READINESS ASSESSMENT"
          Write-Host "=================================="
          
          # Lista de verificaciones pre-producción
          $readinessChecks = @(
            "✅ All tests passed in staging environment",
            "✅ Database backup strategy confirmed",
            "✅ Rollback plan documented and tested", 
            "✅ Maintenance window scheduled",
            "✅ Stakeholder notifications sent",
            "✅ Performance impact assessment completed",
            "✅ Security review completed",
            "✅ Change management approval obtained"
          )
          
          Write-Host "📋 Readiness Checklist:"
          foreach ($check in $readinessChecks) {
            Write-Host "   $check"
          }
          
          Write-Host ""
          Write-Host "⚠️  PRODUCTION DEPLOYMENT REQUIREMENTS:"
          Write-Host "   • Deployment must occur during maintenance window"
          Write-Host "   • Database backup will be created automatically"
          Write-Host "   • Deployment can be rolled back if issues occur"
          Write-Host "   • Application downtime: Estimated 15-30 minutes"
          
          Write-Host ""
          Write-Host "🚨 EMERGENCY CONTACTS:"
          Write-Host "   • Database Admin: dba@company.com"
          Write-Host "   • Development Team: dev-team@company.com"
          Write-Host "   • Operations: ops@company.com"

  # Production deployment
  - deployment: DeployToProdDB
    displayName: 'Deploy Database to Production'
    dependsOn: PreProductionChecks
    environment: 'production'  # Configurar con múltiples aprobaciones
    pool:
      vmImage: 'windows-latest'
    strategy:
      runOnce:
        deploy:
          steps:
          
          # Verificación final antes del deployment
          - task: PowerShell@2
            displayName: 'Final Pre-Deployment Check'
            inputs:
              targetType: 'inline'
              script: |
                Write-Host "🔍 Final pre-deployment verification..."
                
                # Verificar horario de mantenimiento
                $currentHour = (Get-Date).Hour
                $isMaintenanceWindow = ($currentHour -ge 2 -and $currentHour -le 6)  # 2 AM - 6 AM
                
                if (-not $isMaintenanceWindow) {
                  Write-Warning "⚠️  Current time is outside maintenance window (2 AM - 6 AM)"
                  Write-Host "Current time: $(Get-Date -Format 'HH:mm')"
                  
                  # En producción real, esto podría bloquear el deployment
                  # Write-Error "Deployment blocked - outside maintenance window"
                  # exit 1
                }
                
                Write-Host "✅ Pre-deployment check completed"

          - template: templates/database-deployment.yml
            parameters:
              environment: '$(environment)'
              sqlServerInstance: '$(sqlServerInstance)'
              databaseName: '$(databaseName)'
              serviceConnection: '$(serviceConnection)'
              skipValidation: false
              backupDatabase: true
              deploymentMode: 'Incremental'

          # Post-production validation exhaustiva
          - task: PowerShell@2
            displayName: 'Production Validation Suite'
            inputs:
              targetType: 'inline'
              script: |
                Write-Host "🔍 Running comprehensive production validation..."
                
                $productionValidations = @(
                  @{
                    Name = "Database Accessibility"
                    Category = "Connectivity"
                    Critical = $true
                  },
                  @{
                    Name = "Core Business Processes"
                    Category = "Functionality"
                    Critical = $true
                  },
                  @{
                    Name = "Data Integrity Verification"
                    Category = "Data Quality"
                    Critical = $true
                  },
                  @{
                    Name = "Performance Benchmarks"
                    Category = "Performance"
                    Critical = $false
                  },
                  @{
                    Name = "Security Policies"
                    Category = "Security"
                    Critical = $true
                  }
                )
                
                $criticalFailures = 0
                $totalValidations = 0
                
                foreach ($validation in $productionValidations) {
                  $totalValidations++
                  Write-Host ""
                  Write-Host "Testing: $($validation.Name) [$($validation.Category)]"
                  
                  # Simular validación
                  Start-Sleep -Seconds 3
                  
                  $success = (Get-Random -Minimum 1 -Maximum 10) -gt 1  # 90% success rate
                  
                  if ($success) {
                    Write-Host "  ✅ PASSED" -ForegroundColor Green
                  } else {
                    if ($validation.Critical) {
                      Write-Host "  ❌ CRITICAL FAILURE" -ForegroundColor Red
                      $criticalFailures++
                    } else {
                      Write-Host "  ⚠️  WARNING" -ForegroundColor Yellow
                    }
                  }
                }
                
                Write-Host ""
                Write-Host "📊 PRODUCTION VALIDATION RESULTS:"
                Write-Host "   Total Validations: $totalValidations"
                Write-Host "   Critical Failures: $criticalFailures"
                
                if ($criticalFailures -eq 0) {
                  Write-Host "🎉 PRODUCTION DEPLOYMENT SUCCESSFUL!" -ForegroundColor Green
                  Write-Host "   • All critical validations passed"
                  Write-Host "   • Database is ready for production use"
                  Write-Host "   • Applications can be reconnected"
                } else {
                  Write-Error "❌ CRITICAL FAILURES DETECTED - ROLLBACK RECOMMENDED"
                  Write-Host "   • $criticalFailures critical validation(s) failed"
                  Write-Host "   • Review deployment logs immediately"
                  Write-Host "   • Consider activating rollback procedure"
                  exit 1
                }

# ===================================================================
# POST-DEPLOYMENT NOTIFICATIONS
# ===================================================================
- stage: PostDeploymentNotification
  displayName: 'Post-Deployment Notifications'
  dependsOn:
    - DeployDev
    - DeployTest
    - DeployStaging
    - DeployProd
  condition: always()
  jobs:
  - job: SendNotifications
    displayName: 'Send Deployment Notifications'
    pool:
      vmImage: 'windows-latest'
    steps:
    
    - task: PowerShell@2
      displayName: 'Generate Deployment Summary'
      inputs:
        targetType: 'inline'
        script: |
          Write-Host "📧 Generating deployment summary and notifications..."
          
          # Determinar qué ambientes fueron desplegados
          $deployedEnvironments = @()
          
          if ("$(DeployDev.result)" -eq "Succeeded") { $deployedEnvironments += "Development" }
          if ("$(DeployTest.result)" -eq "Succeeded") { $deployedEnvironments += "Test" }
          if ("$(DeployStaging.result)" -eq "Succeeded") { $deployedEnvironments += "Staging" }
          if ("$(DeployProd.result)" -eq "Succeeded") { $deployedEnvironments += "Production" }
          
          Write-Host "🚀 DEPLOYMENT SUMMARY - Vie_ERP Database"
          Write-Host "========================================"
          Write-Host "Build Number: $(Build.BuildNumber)"
          Write-Host "Release Date: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"
          Write-Host "Triggered By: $(Build.RequestedFor)"
          Write-Host "Source Branch: $(Build.SourceBranchName)"
          Write-Host ""
          Write-Host "Deployed Environments:"
          foreach ($env in $deployedEnvironments) {
            Write-Host "  ✅ $env"
          }
          
          if ($deployedEnvironments -contains "Production") {
            Write-Host ""
            Write-Host "🎉 PRODUCTION DEPLOYMENT COMPLETED SUCCESSFULLY!"
            Write-Host "Applications can now be updated to use the new database schema."
          }
          
          # En implementación real, enviar notificaciones por email/Slack/Teams
          Write-Host ""
          Write-Host "📧 Notifications sent to:"
          Write-Host "   • Development Team"
          Write-Host "   • Database Administrators"
          Write-Host "   • Project Stakeholders"
          
          if ($deployedEnvironments -contains "Production") {
            Write-Host "   • Operations Team"
            Write-Host "   • Business Users"
          }