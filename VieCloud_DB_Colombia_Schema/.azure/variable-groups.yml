# Variables de Pipeline para Vie_ERP Database

# ===================================================================
# VARIABLES DE DESARROLLO
# ===================================================================
variables:
- name: DevSqlServer
  value: 'dev-sql.company.local'
- name: DevServiceConnection
  value: 'Dev-SQL-ServiceConnection'

# ===================================================================
# VARIABLES DE TEST
# ===================================================================
- name: TestSqlServer
  value: 'test-sql.company.local'
- name: TestServiceConnection
  value: 'Test-SQL-ServiceConnection'

# ===================================================================
# VARIABLES DE STAGING
# ===================================================================
- name: StagingSqlServer
  value: 'staging-sql.company.local'
- name: StagingServiceConnection
  value: 'Staging-SQL-ServiceConnection'

# ===================================================================
# VARIABLES DE PRODUCCIÓN
# ===================================================================
- name: ProdSqlServer
  value: 'prod-sql.company.local'
- name: ProdServiceConnection
  value: 'Prod-SQL-ServiceConnection'

# ===================================================================
# CONFIGURACIÓN DE NOTIFICACIONES
# ===================================================================
- name: NotificationEmail
  value: 'dev-team@company.com'
- name: SlackWebhook
  value: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'

# ===================================================================
# CONFIGURACIÓN DE BACKUP
# ===================================================================
- name: BackupRetentionDays
  value: '30'
- name: BackupStorageAccount
  value: 'sqlbackupstorage'

# ===================================================================
# CONFIGURACIÓN DE CALIDAD
# ===================================================================
- name: MinimumCodeCoverage
  value: '80'
- name: MaxAllowedWarnings
  value: '10'

# ===================================================================
# TIMEOUTS Y CONFIGURACIÓN DE DESEMPEÑO
# ===================================================================
- name: DeploymentTimeoutMinutes
  value: '60'
- name: ValidationTimeoutMinutes
  value: '30'